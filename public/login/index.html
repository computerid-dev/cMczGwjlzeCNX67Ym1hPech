<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — EchoNote</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/firebase-init.js"></script>
</head>
<body>
<a href="/__trap" style="position:absolute;left:-9999px;top:-9999px" aria-hidden="true" tabindex="-1" rel="nofollow">x</a>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="brand-mark">E</div>
      <div class="brand-name">EchoNote</div>
    </div>
    <h1>Masuk ke akunmu</h1>
    <p class="subtitle">Gunakan username, email, atau nomor telepon.</p>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="identifier">Username / Email / No. Telepon</label>
        <input id="identifier" name="identifier" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn">Masuk</button>
    </form>

    <div class="foot-link">Belum punya akun? <a href="/daftar/">Daftar di sini</a></div>
  </div>
</div>
<script>
  const form = document.getElementById('loginForm');
  const alertBox = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');

  function showAlert(message, type = 'error') {
    alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.innerHTML = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Memproses...';

    const payload = {
      identifier: document.getElementById('identifier').value.trim(),
      password: document.getElementById('password').value,
    };

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        showAlert(data.error || 'Login gagal.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
        return;
      }

      if (data.status === 'rejected') {
        showAlert('Username/email/no. telepon atau password salah.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
        return;
      }

      if (data.status === 'pending') {
        localStorage.setItem('echonote_pending', JSON.stringify({ type: 'login', id: data.pendingId }));
      }
      window.location.href = data.redirect;
    } catch (err) {
      showAlert('Tidak bisa terhubung ke server. Coba lagi.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Masuk';
    }
  });
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script>
</body>
</html>
